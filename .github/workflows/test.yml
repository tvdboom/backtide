name: Linting and tests

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

env:
  PYTHON_VERSION: "3.14"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      docs: ${{ steps.filter.outputs.docs }}
      frontend: ${{ steps.filter.outputs.frontend }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            backend:
              - '**'
              - '!application/**'
              - '!src/backtide/ui/static/**'
            docs:
              - 'docs_sources/**'
              - 'mkdocs.yml'
              - 'README.md'
            frontend:
              - 'application/**'
              - 'src/backtide/ui/static/**'
            python:
              - 'backtide.config.toml'
              - 'pyproject.toml'
              - 'scripts/**/*.py'
              - 'src/backtide/**'
              - '!src/backtide/ui/static/**'
              - 'src/backtide_core/**'
              - 'tests/**'
              - 'tox.ini'
              - 'uv.lock'
            rust:
              - '.cargo/**'
              - 'rustfmt.toml'
              - 'scripts/run_cargo.py'
              - 'src/backtide_core/**'

  pre-commit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ runner.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'tox.ini') }}
          restore-keys: |
            tox-${{ runner.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backtide_core
      - run: |
          uv run --no-default-groups --group tox tox -e pre-commit

  unit-tests:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      UV_LOCK_TIMEOUT: "1200"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ matrix.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'tox.ini') }}
          restore-keys: |
            tox-${{ matrix.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backtide_core
      - name: Run tests
        run: |
          uv run --no-default-groups --group tox tox -m unit -p auto --parallel-no-spinner
      - name: Upload coverage reports to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tvdboom/backtide
          files: ./coverage.xml

  cargo-tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ runner.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'tox.ini') }}
          restore-keys: |
            tox-${{ runner.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backtide_core
      - name: Set Python library path
        run: echo "LD_LIBRARY_PATH=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" >> "$GITHUB_ENV"
      - name: Run Cargo tests
        run: |
          uv run --no-default-groups --group tox tox -e cargo-test
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tvdboom/backtide
          files: ./rust-coverage.info

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir application install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm --dir application test
      - name: Verify the bundled frontend
        run: |
          pnpm --dir application build
          git diff --exit-code -- src/backtide/ui/static

  benchmarks:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ runner.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'tox.ini') }}
          restore-keys: |
            tox-${{ runner.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backtide_core
      - name: Set Python library path
        run: echo "LD_LIBRARY_PATH=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" >> "$GITHUB_ENV"
      - name: Run benchmarks
        run: |
          uv run --no-default-groups --group tox tox -e bench

  documentation:
    needs: changes
    if: >-
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ runner.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'tox.ini') }}
          restore-keys: |
            tox-${{ runner.os }}-${{ github.job }}-py${{ env.PYTHON_VERSION }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backtide_core
      - run: |
          uv run --no-default-groups --group tox tox -e docs
