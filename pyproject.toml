[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "backtide"
dynamic = ["version"]
description = "A refreshingly simple trading backtester for beginner retail investors"
authors = [{name = "Mavs", email = "m.524687@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["Trading", "Backtesting", "Financial markets", "Stocks", "ETF", "Forex", "Crypto"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "click>=8.4.2",
    "cloudpickle>=3.1.2",
    "numpy>=2.4.6",
    "plotly>=6.9.0",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "tzlocal>=5.4.4",
]

[project.optional-dependencies]
full = ["polars>=1.43.2"]

[dependency-groups]
# Utilities for the developer or for the IDE's language server
dev = [
    {include-group = "coverage"},
    {include-group = "docs"},
    {include-group = "lint"},
    {include-group = "pre-commit"},
    {include-group = "test"},
    {include-group = "tox"},
]
docs = [
    "kaleido>=1.2.0",  # For plotly static image export
    "mike>=2.1.4",  # For versioning
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-material>=9.7.7",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-simple-hooks>=0.1.5",
    "pymdown-extensions>=11.0.1",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
]
coverage = [
    "maturin>=1.14.1,<2.0",
]
lint = [
    "ruff>=0.16.3",
    "ty>=0.0.71",
]
pre-commit = [
    "pre-commit>=4.6.2",
    "pre-commit-uv>=4.3.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
]
tox = [
    "tox>=4.60.0",
    "tox-uv>=1.36.0",
]
utils = [
    "rust-just>=1.58.0",
]

[project.urls]
"Documentation" = "https://tvdboom.github.io/backtide/"
"Issues" = "https://github.com/tvdboom/backtide/issues"
"Repository" = "https://github.com/tvdboom/backtide"

[project.scripts]
backtide = "backtide.cli:main"

[tool.uv]
required-version = ">=0.11.13"

[tool.maturin]
python-source = "src"
module-name = "backtide.core"
manifest-path = "src/backtide_core/Cargo.toml"
include = [
    { path = "tests/**/*", format = ["sdist"] },
    { path = "application/**/*", format = ["sdist"] },
    { path = "src/backtide/ui/static/**/*", format = ["sdist", "wheel"] },
]

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 99
indent-width = 4
show-fixes = true
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "I",  # isort
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "D",  # Missing docstring in public function
    "UP",  # pyupgrade
    "YTT",  # flake8-2020
    "BLE",  # blind-except
    "FBT",  # boolean-trap
    "B",  # bugbear
    "A",  # builtins
    "COM",  # commas
    "C4",  # flake8-comprehensions
    "T10",  # debugger
    "ISC",  # implici-str-concat
    "ICN",  # import-conventions
    "G",  # flake8-logging-format
    "INP",  # no-pep420
    "PIE",  # flake8-pie
    "T20",  # print
    "PYI",  # pyi
    "PT",  # flake8-pytest-style
    "Q",  # quotes
    "RSE",  # raise
    "TID",  # tidy-imports
    "ARG",  # flake8-unused-arguments
    "ERA",  # commented-code
    "PD",  # pandas-vet
    "PGH",  # pygrep
    "FLY",  # flynt
    "NPY",  # numpy-specific-rules
    "PERF",  # performance checks
    "RUF",  # ruff
]
ignore = [
    "COM812",  # Trailing comma — conflicts with the ruff formatter
    "E731",  # Do not use a lambda expression
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports
"config.py" = ["F401"]  # Unused imports
"data.py" = ["F401"]  # Unused imports
"storage.py" = ["F401"]  # Unused imports
"price.py" = ["E501"]  # Line too long
"generate_stubs.py" = [
    "INP001",  # Part of an implicit namespace package
    "T201",  # Use print statement
]
"run_cargo.py" = [
    "INP001",  # Part of an implicit namespace package
    "T201",  # Use print statement
]
"rust_coverage.py" = ["INP001"]  # Part of an implicit namespace package

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
